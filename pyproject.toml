[build-system]
requires = ["uv_build>=0.8.17"]
build-backend = "uv_build"

[project]
name = "joyboard"
version = "0.0.1"
description = 'Write text from a joypad'
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
keywords = []
authors = [
  { name = "Tacio Medeiros", email = "taciofvmed@gmail.com" },
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Python :: Implementation :: PyPy",
]
dependencies = [
  "pygame~=2.5.2",
  "keyboard~=0.13.5",
]

[project.urls]
Documentation = "https://github.com/tacio/joyboard#readme"
Issues = "https://github.com/tacio/joyboard/issues"
Source = "https://github.com/tacio/joyboard"

[dependency-groups]
dev = [
  "pytest",
  "coverage[toml]>=6.5",
  "ruff",
  "ty",
]

[tool.uv.build-backend]
module-name = "joyboard"
module-root = "src"

[tool.ruff]
src = ["src", "tests"]

[tool.ty.environment]
# ./src so `joyboard` resolves; "." so test modules can import the `tests` package.
root = ["./src", "."]

[tool.coverage.run]
source_pkgs = ["joyboard", "tests"]
branch = true
parallel = true

[tool.coverage.paths]
joyboard = ["src/joyboard", "*/joyboard/src/joyboard"]
tests = ["tests", "*/joyboard/tests"]

[tool.coverage.report]
exclude_lines = [
  "no cov",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
]
